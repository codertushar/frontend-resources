      <div class="content">
        When building AI-powered interfaces, one of the most critical UX patterns is streaming. Large Language Models (LLMs) can take seconds or even minutes to generate a full response. Waiting for the entire response before showing anything leads to a poor user experience (perceived latency). Streaming allows us to display text as it arrives, chunk by chunk, giving the user immediate feedback. The Technical Challenge Standard HTTP requests usually wait for the full response. To handle streams in JavaScript, we utilize the Streams API, specifically ReadableStream. In a React application, we need to: Initiate the fetch request. Get the response.body reader. Decode the binary chunks (Uint8Array) into text. Update the UI state incrementally without triggering excessive re-renders. Implementation Guide Here is a robust hook useLLMStream that handles streaming, decoding, and error management. The Custom Hook [code example] Rendering the Stream When rendering markdown content that is streaming in, there&#39;s a catch: incomplete markdown syntax (like an unclosed bold tag bold) can break rendering libraries. To solve this, use a robust markdown renderer like react-markdown which handles partial content gracefully, or implement a &quot;blinking cursor&quot; effect to indicate activity. [code example] Performance Considerations flushSync vs requestAnimationFrame Updating React state on every single chunk can be expensive if chunks arrive very fast (e.g., local LLMs). Throttling: You might want to buffer chunks and update the state every 50ms or 100ms. React 18 Batching**: Automatic batching helps, but heavy render trees can still lag. AbortController Always implement cancellation. Users might change their mind while the model is thinking. [code example] Conclusion Streaming is not just a visual flair; it&#39;s a necessity for AI interfaces. By mastering ReadableStream and efficient state updates, you can create chat interfaces that feel responsive and &quot;alive&quot;....
