      <div class="content">
        The sort() method sorts the elements of an array in place and returns the sorted array. Here are two implementations: Bubble Sort and QuickSort. ✅ Bubble Sort Implementation [code example] Key Points about Bubble Sort : Time Complexity : O(n^2) (because of the nested loops). Space Complexity : O(1) (no extra space needed). Bubble Sort is a simple but inefficient sorting algorithm that repeatedly swaps adjacent elements if they are in the wrong order. QuickSort Implementation : [code example] Key Points about QuickSort : Time Complexity : O(n log n) on average, O(n^2) in the worst case. Space Complexity : O(log n) for the recursive stack space. QuickSort is a more efficient algorithm compared to Bubble Sort. It works by selecting a pivot and partitioning the array into two sub-arrays, recursively sorting them. Summary: Bubble Sort : Simple, but inefficient. Its performance deteriorates with large datasets due to its O(n^2) time complexity. QuickSort : More efficient, with average time complexity of O(n log n). It uses a divide-and-conquer approach to partition the array into smaller sub-arrays and sorts them recursively. Both implementations allow you to pass a custom compareFn function for sorting, but if none is provided, they default to lexicographic sorting....
