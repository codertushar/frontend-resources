  <!-- SPA redirect script for GitHub Pages - handles 404.html redirects -->
  <script>
    (function() {
      var params = new URLSearchParams(window.location.search);
      var path = params.get('p');
      var hash = params.get('h');
      if (path) {
        // Detect base path - GitHub Pages uses /frontend-resources, Vercel uses /
        var base = window./frontend-resources/ || '/';
        var basePath = base === '/' ? '' : base.replace(/\/$/, '');
        window.history.replaceState(null, '',
          basePath + path + (hash ? '#' + hash : '')
        );
      }
    })();
  </script>

<body>
  <div id="root"></div>
  <script>
    if ('serviceWorker' in navigator && location.hostname !== 'localhost') {
      window.addEventListener('load', () => {
        // Use dynamic base path for service worker
        var base = window./frontend-resources/ || '/';
        navigator.serviceWorker.register(base + 'service-worker.js')
          .then((registration) => {
            console.log('Service Worker registered successfully');

            // Check for updates every 30 minutes
            setInterval(() => {
              registration.update();
            }, 30 * 60 * 1000);

            // Manual content check trigger
            window.checkForNewArticles = () => {
              if (registration.active) {
                registration.active.postMessage({ type: 'CHECK_NEW_CONTENT' });
              }
            };
          })
          .catch(err => console.error('SW registration failed:', err));
      });
    }
  </script>
