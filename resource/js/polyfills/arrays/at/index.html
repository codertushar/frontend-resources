      <div class="content">
        The at() method takes an integer and returns the item at that index, allowing for positive and negative integers. ✅ Implementation [code example] Explanation: Negative index handling : If the index is negative, it’s adjusted by adding the array’s length. This makes -1 refer to the last element, -2 to the second-to-last, and so on. Bounds check : After adjusting the index, the function checks if it’s within the valid range (i.e., 0 &lt;= index &lt; this.length). If it’s valid, the element at that index is returned; otherwise, undefined is returned. Edge case : If the index is out of bounds (e.g., 100 for an array of length 5), it returns undefined. Examples: customAt(2) returns the element at index 2 (which is 8). customAt(-1) returns the last element (44). customAt(100) returns undefined since the index is out of bounds. This mimics Array.prototype.at while supporting both positive and negative indices.
