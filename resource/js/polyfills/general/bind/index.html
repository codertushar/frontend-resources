  <!-- SPA redirect script for GitHub Pages - handles 404.html redirects -->
  <script>
    (function() {
      var params = new URLSearchParams(window.location.search);
      var path = params.get('p');
      var hash = params.get('h');
      if (path) {
        // Restore the full path (path already excludes /frontend-resources)
        // React Router with basename="/frontend-resources" expects paths like /library, /resource/...
        window.history.replaceState(null, '',
          '/frontend-resources' + path + (hash ? '#' + hash : '')
        );
      }
    })();
  </script>
  <script type="module" crossorigin src="/frontend-resources/assets/index-BOCpuJDq.js"></script>

<body>
  <div id="root"></div>
  <script>
    if ('serviceWorker' in navigator && location.hostname !== 'localhost') {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('/frontend-resources/service-worker.js')
          .catch(err => console.error('SW registration failed:', err));
      });
    }
  </script>
