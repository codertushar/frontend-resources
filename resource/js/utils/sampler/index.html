        In modern JavaScript development, controlling when and how often a function executes is critical for performance optimization and behavior control. Among techniques like throttling and debouncing, sampling offers a unique mechanism: *execute a function once for every N calls. What Is a Sampling Function? A sampling function ensures that a given function runs only once after every fixed number of calls, say every 4th call. This is particularly useful in scenarios like: Rate-limiting logs in noisy systems. Sampling user interactions for telemetry. Reducing computational overhead in frequently triggered UI events. Unlike throttling (which limits function execution by time) or debouncing (which delays execution until quiet time), sampling is count-based. Code Example Here&#39;s a JavaScript implementation of a sampler function: [code example] Usage: [code example] How It Works Internally, sampler: Tracks how many times the returned function has been called (callCount). Executes the original function only when callCount is divisible evenly by the given count (callCount % count === 0). It uses closures to maintain internal state across invocations — an elegant and idiomatic pattern in JavaScript. Use Cases Sampling analytics events in high-frequency environments. Noise reduction in event-driven systems (e.g., mouse movement, scroll). Debug logging only every N times to avoid console spam. Throttling vs Sampling Throttling Time-based Limit execution rate Scroll throttling Edge Considerations Sampling is deterministic — e.g., 4th, 8th, 12th call — unlike time-based throttles which may vary depending on delays. It does not delay execution; it suppresses it until the condition is met. State is local to the returned function. Multiple samplers with the same source function have independent counters. Final Thoughts Sampling is a subtle but powerful tool when you need deterministic execution control based on call frequency. It’s particularly valuable in analytics-heavy o
