        &gt; Interview Importance: 🔴 Critical — Often asked alongside debounce. Understanding the difference between throttle and debounce is essential for any frontend interview. --- 1️⃣ What is Throttle? Throttle ensures a function is called at most once in a specified time period. Unlike debounce (which waits for silence), throttle guarantees regular execution during continuous events. Real-World Analogy Think of a machine gun with a rate limiter: - It can only fire once per second, no matter how fast you pull the trigger - Even if you hold the trigger continuously, it fires at regular intervals --- 2️⃣ Why Use Throttle? Common Use Cases | Use Case | Problem Without Throttle | Solution With Throttle | |----------|--------------------------|------------------------| | Scroll tracking | Hundreds of events per scroll | Update at fixed intervals | | Resize handling | Layout calculations on every pixel | Calculate every N ms | | Mouse move | Tracking every pixel movement | Sample position periodically | | API rate limiting | Overwhelming server with requests | Limit request frequency | | Game loop | Inconsistent frame rates | Fixed update intervals | Performance Comparison --- 3️⃣ How Throttle Works — Implementation Basic Implementation (Leading Edge) 🔍 Dry Run: Step-by-Step Execution --- 4️⃣ Understanding Throttle Variants Leading Edge (Default Above) Executes immediately on first call, then waits: Trailing Edge Executes at the end of the wait period: Both Leading and Trailing --- 5️⃣ Complete Production Implementation Usage Examples --- 6️⃣ React Implementations useThrottle Hook useThrottledValue Hook --- 7️⃣ Throttle vs Debounce | Aspect | Throttle | Debounce | |--------|----------|----------| | When it fires | At regular intervals | After a pause in calls | | Guarantees | Max N calls per second | Only after silence | | Use case | Scroll, resize, rate limiting | Search input, auto-save | | Behavior | Limits frequency | Waits for inactivity | Visual Comparison When
