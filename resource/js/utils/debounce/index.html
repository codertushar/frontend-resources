        Interview Importance: 🔴 Critical — One of the most commonly asked JavaScript interview questions. Expected at every level from junior to senior. 1️⃣ What is Debounce? Debounce is a technique that delays the execution of a function until a certain amount of time has passed since the last time it was invoked. If the function is called again before the delay completes, the timer resets. Real-World Analogy Think of an elevator door: When someone enters, the door waits a few seconds before closing If another person enters during that wait, the timer resets The door only closes after no one has entered for the full delay period [code example] 2️⃣ Why Use Debounce? Common Use Cases Problem Without Debounce API call on every keystroke Layout calculation on every pixel Multiple submissions on rapid clicks Save on every character Hundreds of events per scroll Performance Impact [code example] 3️⃣ How Debounce Works — Implementation Basic Implementation [code example] 🔍 Dry Run: Step-by-Step Execution [code example] [code example] Result: Only &quot;C&quot; is logged, 1000ms after the last call. 4️⃣ Understanding Key Concepts Why clearTimeout(timerId)? [code example] Why fn.apply(this, args)? Preserves the correct this context and passes arguments: [code example] Why Return a Function (Closure)? The returned function &quot;remembers&quot; timerId between calls: [code example] 5️⃣ Advanced Implementations With Immediate/Leading Edge Option Sometimes you want to execute immediately on first call, then debounce subsequent calls: [code example] With Cancel and Flush Methods [code example] With Max Wait (Throttle Fallback) Ensures function is called at least once every maxWait ms: [code example] 6️⃣ React Implementations Using useCallback + useRef [code example] Debounced Value Hook [code example] 7️⃣ Debounce vs Throttle Debounce After a pause in calls Once after delay Search input, auto-save Waits for silence Visual Comparison [code example] 8️⃣ Common Interview Questions
