        &gt; Interview Importance: 🔴 Critical — One of the most commonly asked JavaScript interview questions. Expected at every level from junior to senior. --- 1️⃣ What is Debounce? Debounce is a technique that delays the execution of a function until a certain amount of time has passed since the last time it was invoked. If the function is called again before the delay completes, the timer resets. Real-World Analogy Think of an elevator door: - When someone enters, the door waits a few seconds before closing - If another person enters during that wait, the timer resets - The door only closes after no one has entered for the full delay period --- 2️⃣ Why Use Debounce? Common Use Cases | Use Case | Problem Without Debounce | Solution With Debounce | |----------|--------------------------|------------------------| | Search Input | API call on every keystroke | API call after user stops typing | | Window Resize | Layout calculation on every pixel | Calculate after resize ends | | Button Click | Multiple submissions on rapid clicks | Single submission after clicks stop | | Auto-save | Save on every character | Save after user pauses typing | | Scroll Events | Hundreds of events per scroll | Process after scroll stops | Performance Impact --- 3️⃣ How Debounce Works — Implementation Basic Implementation 🔍 Dry Run: Step-by-Step Execution Result: Only is logged, 1000ms after the last call. --- 4️⃣ Understanding Key Concepts Why ? Why ? Preserves the correct context and passes arguments: Why Return a Function (Closure)? The returned function &quot;remembers&quot; between calls: --- 5️⃣ Advanced Implementations With Immediate/Leading Edge Option Sometimes you want to execute immediately on first call, then debounce subsequent calls: With Cancel and Flush Methods With Max Wait (Throttle Fallback) Ensures function is called at least once every ms: --- 6️⃣ React Implementations Using useCallback + useRef Debounced Value Hook --- 7️⃣ Debounce vs Throttle | Aspect | Debounce | Throttle | |--------...
