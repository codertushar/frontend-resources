        Promise.any() takes an iterable of promises and returns a single promise that resolves as soon as any of the input promises fulfills. If all promises reject, it rejects with an AggregateError containing all rejection reasons. 🧠 Understanding Promise.any Atom 1: Purpose Promise.any returns a promise that: ✅ Resolves as soon as any input promise resolves ❌ Rejects only if all input promises reject Atom 2: Normalization Convert all inputs to promises with Promise.resolve(...) Atom 3: Resolve on First Fulfilled On first .then, resolve the outer promise. Atom 4: Track Rejections Maintain count of rejections. If all promises reject, reject with AggregateError , which contains all rejection reasons. Atom 5: Edge Case If input is empty → reject immediately with AggregateError ✅ Implementation: promiseAny [code example] 🧪 Example: [code example] ❌ If all reject: [code example]...
