        &gt; Interview Importance: 🔴 Critical — Asked in 90% of JavaScript interviews. Understanding prototypes is fundamental to understanding how JavaScript works under the hood. --- 1️⃣ What is a Prototype? JavaScript uses prototype-based inheritance, meaning objects inherit properties and methods from other objects via the chain — not through classical class-based inheritance like Java or C++. Core Concept Every JavaScript object has an internal link to another object called its prototype. When you access a property on an object, JavaScript first looks at the object itself. If not found, it looks up the prototype chain until it finds the property or reaches . --- 2️⃣ Why Do Prototypes Matter? Memory Efficiency Without prototypes, each object instance would have its own copy of every method: Real-World Impact - 1000 instances without prototype: 1000 function objects in memory - 1000 instances with prototype: 1 shared function object --- 3️⃣ How Prototypes Work — Step by Step 3.1 The Property (Functions) Every JavaScript function has a property (an object) that becomes the prototype of instances created with . 🔍 Dry Run: What happens when is called? 3.2 The Property (Objects) Every object has a property pointing to its prototype. This is how the chain is traversed. 3.3 Visualizing the Chain --- 4️⃣ Prototype Inheritance (Extending) Using Object.create() 🔍 Dry Run: Prototype Chain After Inheritance Why Each Step Matters | Step | Code | Purpose | |------|------|---------| | 1 | | Initialize parent properties on | | 2 | | Link prototype chain WITHOUT calling | | 3 | | Fix constructor reference (otherwise points to Person) | | 4 | Add methods to | Define child-specific behavior | ❌ Common Mistake: Using Instead of --- 5️⃣ ES6 Class Syntax (Syntactic Sugar) ES6 is syntactic sugar over prototype-based inheritance: Under the Hood — Same Prototype Chain! --- 6️⃣ Key Methods for Working with Prototypes | Method | Purpose | Example | |--------|---------|---------| | | Creat
