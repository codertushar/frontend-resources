<!DOCTYPE html>
<html>

<head>
    <title>Generate PWA Icons</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            padding: 20px;
            max-width: 600px;
            margin: 0 auto;
        }

        canvas {
            border: 1px solid #ccc;
            margin: 10px 0;
        }

        button {
            background: #00bfa5;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 5px;
            cursor: pointer;
            margin: 5px;
        }

        button:hover {
            background: #00a890;
        }

        .icon-preview {
            display: flex;
            gap: 20px;
            margin: 20px 0;
        }
    </style>
</head>

<body>
    <h1>PWA Icon Generator</h1>
    <p>This will generate 192x192 and 512x512 PNG icons for your PWA.</p>

    <div class="icon-preview">
        <div>
            <h3>192x192</h3>
            <canvas id="canvas192" width="192" height="192"></canvas>
            <br>
            <button onclick="downloadIcon(192)">Download 192x192</button>
        </div>
        <div>
            <h3>512x512</h3>
            <canvas id="canvas512" width="512" height="512"></canvas>
            <br>
            <button onclick="downloadIcon(512)">Download 512x512</button>
        </div>
    </div>

    <script>
        function drawIcon(size) {
            const canvas = document.getElementById(`canvas${size}`);
            const ctx = canvas.getContext('2d');

            // Background
            ctx.fillStyle = '#ffffff';
            ctx.fillRect(0, 0, size, size);

            // Draw a modern code/bracket icon
            const padding = size * 0.15;
            const iconSize = size - (padding * 2);

            // Main color
            ctx.strokeStyle = '#00bfa5';
            ctx.fillStyle = '#00bfa5';
            ctx.lineWidth = size * 0.08;
            ctx.lineCap = 'round';
            ctx.lineJoin = 'round';

            // Left bracket
            ctx.beginPath();
            ctx.moveTo(padding + iconSize * 0.35, padding);
            ctx.lineTo(padding, padding + iconSize * 0.5);
            ctx.lineTo(padding + iconSize * 0.35, padding + iconSize);
            ctx.stroke();

            // Right bracket
            ctx.beginPath();
            ctx.moveTo(padding + iconSize * 0.65, padding);
            ctx.lineTo(padding + iconSize, padding + iconSize * 0.5);
            ctx.lineTo(padding + iconSize * 0.65, padding + iconSize);
            ctx.stroke();

            // Center slash
            ctx.beginPath();
            ctx.moveTo(padding + iconSize * 0.6, padding + iconSize * 0.2);
            ctx.lineTo(padding + iconSize * 0.4, padding + iconSize * 0.8);
            ctx.stroke();
        }

        function downloadIcon(size) {
            const canvas = document.getElementById(`canvas${size}`);
            const link = document.createElement('a');
            link.download = `icon-${size}.png`;
            link.href = canvas.toDataURL('image/png');
            link.click();
        }

        // Draw icons on load
        drawIcon(192);
        drawIcon(512);
    </script>
</body>

</html>
