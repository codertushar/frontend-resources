<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Frontend Resources</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/github-markdown-css/5.2.0/github-markdown-light.min.css">
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
            line-height: 1.6;
            color: #24292e;
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
        }
        .container {
            padding: 45px;
            border: 1px solid #e1e4e8;
            border-radius: 6px;
            background-color: #fff;
        }
        pre {
            background-color: #f6f8fa;
            border-radius: 6px;
            padding: 16px;
            overflow: auto;
            font-size: 14px;
        }
        .tree-item {
            white-space: nowrap;
        }
        .directory-name {
            font-weight: bold;
        }
        /* Style for folder icons */
        .folder-icon {
            margin-right: 5px;
        }
        /* Style for file icons */
        .file-icon {
            margin-right: 5px;
        }
        /* GitHub-style header */
        .header {
            background-color: #24292e;
            color: white;
            padding: 16px;
            border-radius: 6px 6px 0 0;
        }
        .header h1 {
            margin: 0;
            font-size: 24px;
        }
        /* GitHub-style footer */
        .footer {
            margin-top: 30px;
            border-top: 1px solid #e1e4e8;
            padding-top: 20px;
            color: #586069;
            font-size: 12px;
            text-align: center;
        }
        /* Override GitHub markdown CSS for our specific use */
        .markdown-body {
            box-sizing: border-box;
            min-width: 200px;
            max-width: 980px;
            margin: 0 auto;
        }
        @media (max-width: 767px) {
            .markdown-body {
                padding: 15px;
            }
        }
        /* Custom styles for our tree view */
        .repo-structure {
            font-family: Consolas, "Liberation Mono", Menlo, Courier, monospace;
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>Frontend Resources</h1>
        <p>A collection of JavaScript resources, polyfills, and examples</p>
    </div>
    
    <div class="container markdown-body">
        <div id="readme-content">
            <!-- README content will be loaded here via JavaScript -->
            <p>Loading content...</p>
        </div>
    </div>
    
    <div class="footer">
        <p>© 2025 Frontend Resources | <a href="https://github.com/yourusername/frontend-resources">GitHub Repository</a></p>
    </div>

    <script>
        // Function to fetch README content and render it
        async function loadReadme() {
            try {
                const response = await fetch('README.md');
                const text = await response.text();
                
                // Simple markdown to HTML conversion for the tree structure
                let html = text
                    .replace(/^# (.+)$/gm, '<h1>$1</h1>')
                    .replace(/^## (.+)$/gm, '<h2>$1</h2>')
                    .replace(/^### (.+)$/gm, '<h3>$1</h3>')
                    .replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
                
                // Preserve our tree structure with pre tags
                const prePattern = /<pre>([\s\S]*?)<\/pre>/g;
                html = html.replace(prePattern, (match, content) => {
                    return `<pre class="repo-structure">${content}</pre>`;
                });
                
                document.getElementById('readme-content').innerHTML = html;
            } catch (error) {
                console.error('Error loading README:', error);
                document.getElementById('readme-content').innerHTML = '<p>Error loading content. Please check the console for details.</p>';
            }
        }

        // Load the README content when the page loads
        window.addEventListener('DOMContentLoaded', loadReadme);
    </script>
</body>
</html>
